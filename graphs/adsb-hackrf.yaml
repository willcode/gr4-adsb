# The capture half of the split receiver on a live HackRF.
#
# SoapySource -> PpmFramer -> ModeSDecode -> DataSetToPacket -> ZmqPacketSink
#
# What a user changes here: the device gain, the framer's phase_steps and coarse_ratio, and the sink's endpoint.
#
# The device is asked for the rate, the frequency and the gain. 2 MS/s is an even integer multiple of 1 MHz, as
# the framer requires. A HackRF at 1090 MHz needs about 100 dB of gain, which SoapyHackRF splits across its three
# stages as LNA 31, AMP 14 and VGA 55. rx_bandwidths stays an empty vector, which is how the block is told not to
# ask at all, as against a zero, which it would apply; the 1.75 MHz the driver picks for this rate is its own
# floor and is wider than the pulses.
#
# phase_steps 1 and coarse_ratio 1.0 turn the framer's sub-sample phase search off, which is what a machine as
# small as a Raspberry Pi 3 needs to keep up at this rate. A machine with the cycles to spare wants the
# application's 8 and 0.5, which find frames whose preamble falls between samples.
#
# The sink binds every interface, because the printer connects from another machine; a machine on an untrusted
# network needs a firewall rule on 5560.
blocks:
  - id: gr::blocks::sdr::SoapySource<complex<float32>>
    parameters:
      name: radio
      device: !!str "hackrf"
      device_parameter: !!str ""
      sample_rate: !!float32 2000000
      frequency: !!float64
        - 1090000000
      rx_gains: !!float64
        - 100
      rx_bandwidths: !!float64 []
  - id: adsb::PpmFramer<complex<float32>>
    parameters:
      name: framer
      profile: !!str "mode_s"
      sample_rate: !!float32 2000000
      threshold: !!float32 2
      phase_steps: !!uint32 1
      coarse_ratio: !!float32 1.0
  - id: adsb::ModeSDecode
    parameters:
      name: decoder
  - id: gr::blocks::basic::DataSetToPacket<uint8>
    parameters:
      name: to_packet
      source_label: !!str "adsb-hackrf"
      frequency_hz: !!float64 1090000000
  - id: gr::blocks::network::ZmqPacketSink<uint8>
    parameters:
      name: packet_sink
      endpoint: !!str "tcp://0.0.0.0:5560"
      bind: !!bool true
      pattern: !!str "pub"
      topic: !!str "adsb"
      linger_ms: !!int32 500
connections:
  - [radio, out, framer, in]
  - [framer, out, decoder, in]
  - [decoder, out, to_packet, in]
  - [to_packet, out, packet_sink, in]
