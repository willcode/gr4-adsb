# The printer half of the split receiver: the packets of adsb-capture.yaml or adsb-rtl.yaml, rendered as lines.
#
# ZmqPacketSource -> PacketToDataSet -> AdsbPrinter -> DataSetSink
#
# The decode happened at the radio. The decoder's own record crosses the network, so this end renders and never
# re-decodes.
#
# A user edits one setting here: endpoint. It is 127.0.0.1 for both halves on one machine, and the receiving
# machine's address otherwise.
#
# AdsbPrinter publishes its line as a record and, with to_stdout, also writes it to standard output.
blocks:
  # max_message_bytes is required and has no default: it bounds what libzmq allocates for a peer's claim before
  # this block sees a byte. A Mode S frame is 14 octets and its envelope a few hundred.
  - id: gr::blocks::network::ZmqPacketSource<uint8>
    parameters:
      name: packet_source
      endpoint: !!str "tcp://127.0.0.1:5560"
      bind: !!bool false
      pattern: !!str "sub"
      topic: !!str "adsb"
      max_message_bytes: !!uint64 65536
  - id: gr::blocks::basic::PacketToDataSet<uint8>
    parameters:
      name: to_record
      signal_label: !!str "adsb"
  - id: adsb::AdsbPrinter
    parameters:
      name: printer
      to_stdout: !!bool true
      table_size: !!uint32 256
  - id: gr::blocks::basic::DataSetSink<uint8>
    parameters:
      name: console
      signal_name: !!str "adsb-lines"
connections:
  - [packet_source, out, to_record, in]
  - [to_record, out, printer, in]
  - [printer, out, console, in]
