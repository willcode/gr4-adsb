# The capture half of the split receiver, reading a recorded capture instead of a radio.
#
# BasicFileSource -> Convert -> InterleavedToComplex -> PpmFramer -> ModeSDecode -> DataSetToPacket -> ZmqPacketSink
#
# A user edits two settings here: file_name, the capture to read, and the framer's sample_rate, the capture's own
# rate and an even integer multiple of 1 MHz.
#
# The registry has InterleavedToComplex only from float32, so the int16 pairs are widened first. Convert applies
# no scaling, and the framer needs none: it nominates on a ratio and decides bits by comparison.
blocks:
  - id: gr::blocks::fileio::BasicFileSource<int16>
    parameters:
      name: capture_file
      # the recording to read, interleaved 16-bit I/Q, relative to the directory the graph is run in
      file_name: !!str "capture.cs16"
  - id: gr::blocks::basic::Convert<int16, float32>
    parameters:
      name: widen
  - id: gr::blocks::basic::InterleavedToComplex<float32, complex<float32>>
    parameters:
      name: to_complex
  - id: adsb::PpmFramer<complex<float32>>
    parameters:
      name: framer
      profile: !!str "mode_s"
      sample_rate: !!float32 2000000
      threshold: !!float32 2
      phase_steps: !!uint32 8
      coarse_ratio: !!float32 0.5
  - id: adsb::ModeSDecode
    parameters:
      name: decoder
  - id: gr::blocks::basic::DataSetToPacket<uint8>
    parameters:
      name: to_packet
      source_label: !!str "adsb-capture"
      frequency_hz: !!float64 1090000000
  # The producer binds, being the stable end; linger_ms holds the socket open briefly at teardown so the last
  # frames of a file that has just ended are not discarded with the graph.
  - id: gr::blocks::network::ZmqPacketSink<uint8>
    parameters:
      name: packet_sink
      endpoint: !!str "tcp://127.0.0.1:5560"
      bind: !!bool true
      pattern: !!str "pub"
      topic: !!str "adsb"
      linger_ms: !!int32 500
connections:
  - [capture_file, out, widen, in]
  - [widen, out, to_complex, interleaved]
  - [to_complex, out, framer, in]
  - [framer, out, decoder, in]
  - [decoder, out, to_packet, in]
  - [to_packet, out, packet_sink, in]
